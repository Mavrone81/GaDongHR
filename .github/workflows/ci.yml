name: ci

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose. action-setup v4 hard-errors with "Multiple
      # versions of pnpm specified" when `version:` is given AND package.json
      # has `packageManager`. package.json is the source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --ci
