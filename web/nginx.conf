# GaDongHR web — nginx-unprivileged server block (Task 15).
#
# Replaces the base image's own default.conf. Two things matter here:
#
#   1. `listen 8080` — nginxinc/nginx-unprivileged's whole point (a
#      non-root `nginx` user cannot bind :80), matching this Dockerfile's
#      `EXPOSE 8080` and the rest of this repo's non-root containers.
#   2. `try_files $uri $uri/ /index.html` — this is a client-side-routed
#      SPA (react-router, see web/src/App.tsx). Without this fallback,
#      nginx 404s on any direct load or refresh of a deep path like
#      `/admin/statutory-rules`, because no such file exists on disk —
#      only `/index.html` + client-side routing produces that page.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
