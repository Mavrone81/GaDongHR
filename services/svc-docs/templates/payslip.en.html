<div class="payslip">
  <h1>Payslip</h1>
  <table class="meta">
    <tr><td>Employer</td><td>{{companyName}}</td></tr>
    <tr><td>Employee</td><td>{{employeeName}}</td></tr>
    <tr><td>Pay date</td><td>{{payDate}}</td></tr>
  </table>
  <table class="lines">
    <tr><th>Description</th><th>Amount</th></tr>
    <tr><td>Salary / wage</td><td>{{grossPay}}</td></tr>
    <tr><td>Social Security Fund</td><td>-{{socialSecurityDeduction}}</td></tr>
    <tr><td><strong>Net pay</strong></td><td><strong>{{netPay}}</strong></td></tr>
  </table>
</div>
