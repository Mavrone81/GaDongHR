<div class="contract" lang="th">
  <h1>สัญญาจ้างงาน</h1>
  <p>สัญญาฉบับนี้ทำขึ้นระหว่าง <strong>{{companyName}}</strong> ("นายจ้าง") กับ <strong>{{employeeName}}</strong> ("พนักงาน") มีผลตั้งแต่วันที่ {{startDate}}</p>
  <p>ค่าจ้างรายเดือนของพนักงานคือ {{grossPay}} จ่ายในวันทำการสุดท้ายของแต่ละเดือน</p>
  <p>ความยินยอม: พนักงานรับทราบและเข้าใจเงื่อนไขของสัญญาฉบับนี้แล้ว</p>
</div>
