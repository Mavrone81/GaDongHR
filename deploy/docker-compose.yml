# GaDongHR — full-system Docker Compose (skeleton, Stage 2)
# Usage:
#   cp .env.example .env   # then fill values — NEVER commit .env
#   docker compose --profile core up -d
#   docker compose --profile core --profile observability up -d
# Service images are placeholders (built from /services/* in later stages).

name: gadonghr

x-service-defaults: &svc
  restart: unless-stopped
  networks: [internal]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    svc-crypto: { condition: service_healthy }
  environment: &svc-env
    NODE_ENV: ${NODE_ENV:-production}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    CRYPTO_URL: https://svc-crypto:8443
    CONFIG_URL: http://svc-config:3000
    AUTHZ_URL: http://svc-authz:3000
    OIDC_ISSUER: https://${PUBLIC_HOST}/auth/realms/gadonghr
    DEFAULT_LOCALE: ${DEFAULT_LOCALE:-th}

services:
  # ---------- Edge ----------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [internal]
    profiles: [core]

  web:
    image: gadonghr/web:${GADONG_VERSION:-latest}
    <<: *svc
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.web.tls.certresolver=le
    profiles: [core]

  # ---------- Identity ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--hostname=https://${PUBLIC_HOST}/auth", "--http-relative-path=/auth", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kc.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/auth`)
      - traefik.http.routers.kc.tls.certresolver=le
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok"]
      interval: 15s
      retries: 10
    profiles: [core]

  # ---------- Key management ----------
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    volumes:
      - vault_data:/vault/data
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 15s
      retries: 20
    profiles: [core]

  svc-crypto:
    image: gadonghr/svc-crypto:${GADONG_VERSION:-latest}
    restart: unless-stopped
    networks: [internal]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ID: ${VAULT_APPROLE_ID}
      VAULT_APPROLE_SECRET_FILE: /run/secrets/vault_approle_secret
    secrets: [vault_approle_secret]
    depends_on:
      vault: { condition: service_healthy }
    healthcheck: &http-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      retries: 10
    profiles: [core]

  # ---------- Data plane ----------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # creates schema-per-service roles/grants
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 12
    profiles: [core]

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      retries: 10
    profiles: [core]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 15s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    profiles: [core]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      retries: 10
    profiles: [core]

  # ---------- Face engine (CompreFace composite) ----------
  compreface-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: frs
      POSTGRES_USER: ${CF_DB_USER}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD}
    volumes: [cf_pg_data:/var/lib/postgresql/data]
    networks: [internal]
    profiles: [core]

  compreface-api:
    image: exadel/compreface-api:latest
    restart: unless-stopped
    environment:
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/frs
      POSTGRES_USER: ${CF_DB_USER}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD}
    depends_on: [compreface-postgres, compreface-core]
    networks: [internal]
    profiles: [core]

  compreface-core:
    image: exadel/compreface-core:latest
    restart: unless-stopped
    environment: { ML_PORT: "3000" }
    networks: [internal]
    profiles: [core]

  # ---------- Platform services ----------
  svc-authz:   { image: "gadonghr/svc-authz:${GADONG_VERSION:-latest}",   <<: *svc, healthcheck: *http-health, profiles: [core] }
  svc-config:  { image: "gadonghr/svc-config:${GADONG_VERSION:-latest}",  <<: *svc, healthcheck: *http-health, profiles: [core] }
  svc-i18n:    { image: "gadonghr/svc-i18n:${GADONG_VERSION:-latest}",    <<: *svc, healthcheck: *http-health, profiles: [core] }
  svc-notify:  { image: "gadonghr/svc-notify:${GADONG_VERSION:-latest}",  <<: *svc, healthcheck: *http-health, profiles: [core],
                 environment: { <<: *svc-env, SMTP_URL: "${SMTP_URL}" } }
  svc-docs:    { image: "gadonghr/svc-docs:${GADONG_VERSION:-latest}",    <<: *svc, healthcheck: *http-health, profiles: [core],
                 environment: { <<: *svc-env, S3_ENDPOINT: "http://minio:9000", S3_ACCESS_KEY: "${MINIO_ROOT_USER}", S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}" } }
  svc-audit:   { image: "gadonghr/svc-audit:${GADONG_VERSION:-latest}",   <<: *svc, healthcheck: *http-health, profiles: [core],
                 volumes: ["audit_anchor:/anchor"] }

  # ---------- Module services (M1–M7) ----------
  svc-onboarding: { image: "gadonghr/svc-onboarding:${GADONG_VERSION:-latest}", <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.onb.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/onboarding`)","traefik.http.routers.onb.tls.certresolver=le"] }
  svc-scheduler:  { image: "gadonghr/svc-scheduler:${GADONG_VERSION:-latest}",  <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.sch.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/scheduler`)","traefik.http.routers.sch.tls.certresolver=le"] }
  svc-timesheet:  { image: "gadonghr/svc-timesheet:${GADONG_VERSION:-latest}",  <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.tsh.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/timesheet`)","traefik.http.routers.tsh.tls.certresolver=le"] }
  svc-attendance: { image: "gadonghr/svc-attendance:${GADONG_VERSION:-latest}", <<: *svc, healthcheck: *http-health, profiles: [core],
                    environment: { <<: *svc-env, FACE_API_URL: "http://compreface-api:8080", FACE_MATCH_THRESHOLD: "${FACE_MATCH_THRESHOLD:-0.92}" },
                    labels: ["traefik.enable=true","traefik.http.routers.att.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/attendance`)","traefik.http.routers.att.tls.certresolver=le"] }
  svc-leave:      { image: "gadonghr/svc-leave:${GADONG_VERSION:-latest}",      <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.lve.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/leave`)","traefik.http.routers.lve.tls.certresolver=le"] }
  svc-claims:     { image: "gadonghr/svc-claims:${GADONG_VERSION:-latest}",     <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.clm.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/claims`)","traefik.http.routers.clm.tls.certresolver=le"] }
  svc-payroll:    { image: "gadonghr/svc-payroll:${GADONG_VERSION:-latest}",    <<: *svc, healthcheck: *http-health, profiles: [core],
                    labels: ["traefik.enable=true","traefik.http.routers.pay.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/payroll`)","traefik.http.routers.pay.tls.certresolver=le"] }

  retention-job:
    image: gadonghr/retention-job:${GADONG_VERSION:-latest}
    <<: *svc
    profiles: [core]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks: [internal]
    volumes: [clamav_db:/var/lib/clamav]
    profiles: [core]

  # ---------- Observability (optional) ----------
  prometheus: { image: prom/prometheus:latest, restart: unless-stopped, networks: [internal], volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prom_data:/prometheus"], profiles: [observability] }
  loki:       { image: grafana/loki:3.0,      restart: unless-stopped, networks: [internal], volumes: ["loki_data:/loki"], profiles: [observability] }
  grafana:    { image: grafana/grafana:latest, restart: unless-stopped, networks: [internal], environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}" }, volumes: ["grafana_data:/var/lib/grafana"], profiles: [observability],
                labels: ["traefik.enable=true","traefik.http.routers.graf.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/grafana`)","traefik.http.routers.graf.tls.certresolver=le"] }

networks:
  internal:
    name: gadong-internal

secrets:
  vault_approle_secret:
    file: ./secrets/vault_approle_secret   # gitignored

volumes:
  pg_data:
  cf_pg_data:
  vault_data:
  rabbitmq_data:
  minio_data:
  letsencrypt:
  audit_anchor:
  clamav_db:
  prom_data:
  loki_data:
  grafana_data:
