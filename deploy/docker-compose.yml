# GaDongHR — full-system Docker Compose (Task 13)
#
# Rewritten from the Stage-2 skeleton this file used to be: that skeleton
# predated every real service, named services that were never built
# (svc-onboarding..svc-payroll, compreface-*, clamav — M1-M7 do not exist
# yet, brief: "do not add them"), and omitted svc-audit, which does exist.
# This file reflects what is actually in `services/*` today: svc-crypto,
# svc-config, svc-authz, svc-audit, svc-i18n, svc-notify, svc-docs — read
# from each one's own Dockerfile/package.json/app.module.ts, not assumed.
#
# Local/dev/CI usage (builds images from source):
#   cp .env.example .env            # then fill every CHANGE_ME
#   docker compose up -d
#
# Production usage (pulls pre-built GHCR images, never builds on the
# server — roadmap "Standing constraints"):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Target host: gadonghr-prod, 157.230.38.96 (sgp1), 2 vCPU / 4 GB / 80 GB,
# DEDICATED (not shared droplet 165) — Traefik owns :80/:443 and
# terminates TLS itself via Let's Encrypt. No host nginx, no loopback-port
# overlay. See deploy/README.md for the full memory budget.

name: gadonghr

x-node-defaults: &node-defaults
  restart: unless-stopped
  networks: [internal]
  security_opt: ["no-new-privileges:true"]

# Every one of the seven services exposes `GET /health` on
# `127.0.0.1:3000` (every `main.ts`'s own comment: "Port 3000 on 0.0.0.0
# matches every other service's container contract"). `buildHealth`
# (packages/kernel/src/health.ts) always returns HTTP 200 — a `degraded`
# dependency (e.g. Vault sealed) is reported in the JSON body's `status`
# field, not as a non-200 — so this healthcheck only proves "the process
# is serving", which is the correct thing for Docker to restart on; it
# deliberately does NOT fail the container just because Vault is sealed
# after a reboot (health.ts's own comment: "must not look like a crashed
# container"). alpine's busybox `wget` (not `curl`, which is not installed
# in the node:22-alpine runtime image) is what every Dockerfile's image
# actually has available.
x-http-health: &http-health
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 20s

# Task 13c: every service that mounts the kernel's `PermissionGuard`
# (`packages/kernel/src/authz/guard.ts`) now also mounts `OidcMiddleware`
# (`packages/kernel/src/authz/oidc.middleware.ts`) — the guard reads
# `request.userId`, and until this task nothing ever set it, so every
# guarded route was unreachable (`AUZ-403` on every request; found via
# `seed.sh`'s pack import in Task 13, see task-13-report.md deviation 2).
# `OIDC_ISSUER` MUST equal Keycloak's own configured issuer for this realm
# — that is `--hostname=https://${PUBLIC_HOST}/auth` (below) plus
# `/realms/<realm>`, the PUBLIC address, because that is the literal string
# Keycloak stamps into every token's `iss` claim regardless of which
# network path a service used to reach it. `OIDC_JWKS_URI` is the INTERNAL
# address on purpose — a container-to-container JWKS fetch has no reason to
# round-trip through Traefik/TLS the way a browser does, matching
# `AUTHZ_URL`/`CRYPTO_URL` elsewhere in this file. Task 15b: the `gadonghr`
# realm itself (clients `web`/`seeder`, NOT a client literally named
# `gadonghr-services` — that string is a logical audience value, stamped
# into `aud` by an audience protocol mapper on both clients, matching
# `OIDC_AUDIENCE` below exactly) is provisioned by
# `keycloak/realm-gadonghr.json`, imported by the `keycloak` service's own
# `--import-realm` flag below — see deploy/keycloak/README.md.
x-oidc-env: &oidc-env
  OIDC_ISSUER: https://${PUBLIC_HOST}/auth/realms/gadonghr
  OIDC_AUDIENCE: gadonghr-services
  OIDC_JWKS_URI: http://keycloak:8080/auth/realms/gadonghr/protocol/openid-connect/certs

services:
  # ==================== Edge ====================
  traefik:
    image: traefik:v3.1
    <<: *node-defaults
    mem_limit: 96m
    # Task 16f: the Docker provider (`--providers.docker=true` etc., what
    # used to be here) can never work on this host — Traefik's bundled
    # Docker client pins API version 1.24, the host daemon (Docker 29.6)
    # requires >=1.40, and neither `DOCKER_API_VERSION=1.44` on this
    # container nor upgrading the image to v3.5.6 (nor both together)
    # changed that error, verified across four live attempts (see
    # traefik.yml's header and task-16f-traefik-report.md). With the
    # provider permanently failing, Traefik discovered zero containers
    # and had zero routers — every request 404'd, and ACME never got a
    # hostname to request a certificate for. Replaced with the file
    # provider (`./traefik.yml`, `./dynamic/routes.yml`) — a static
    # routing table for a fixed, one-host, fifteen-service deployment,
    # which also lets `/var/run/docker.sock` (below) come off entirely:
    # an edge-facing proxy no longer needs read access to the whole
    # Docker API (every other container's config, every mounted secret
    # path) just to route requests, a real reduction in attack surface on
    # top of fixing the bug. `PUBLIC_HOST` is passed through as a real
    # environment variable so `dynamic/routes.yml`'s `{{ env
    # "PUBLIC_HOST" }}` Go-template reference can read it — the file
    # provider does not do `docker compose`-style `${VAR}` substitution
    # itself (checked against the file-provider docs, not assumed), so
    # this is how the hostname stays out of that committed file.
    #
    # `--configFile` is the ONLY flag here — verified empirically (not
    # assumed) that Traefik treats static configuration as single-source,
    # not merged: with `--configFile` set (or even a file merely present
    # at Traefik's default `/etc/traefik/traefik.yml` discovery path with
    # no `--configFile` flag at all), every other CLI flag AND every
    # `TRAEFIK_*` env var for static config is silently ignored — proven
    # by adding `--certificatesresolvers.le.acme.email=...` and even
    # `--api.insecure=true` alongside `--configFile` here and seeing
    # neither take effect (`le` still logged as "nonexistent certificate
    # resolver"; `/api/overview` still 404'd). So the ACME resolver
    # (`certificatesResolvers.le`, including its contact email) now lives
    # entirely inside `traefik.yml` itself, not here — see that file for
    # why the email is a plain committed value rather than `${ACME_EMAIL}`
    # (it cannot be templated in Traefik's STATIC config the way
    # `PUBLIC_HOST` is templated in the DYNAMIC `routes.yml` above; Go
    # templating is dynamic-config-only, also verified against the docs).
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    # The only container in this file that publishes a host port — every
    # other service is reachable only on the internal compose network
    # (brief §1: "Only Traefik publishes ports. Everything else is
    # internal.").
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== Identity ====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    <<: *node-defaults
    mem_limit: 768m
    # Task 15b: `--import-realm` imports every realm JSON found under
    # `/opt/keycloak/data/import` on EVERY boot, but Keycloak's own import
    # strategy skips a realm that already exists (`IGNORE_EXISTING`) — so
    # this is idempotent across restarts, the same contract every other
    # bootstrap step in this file relies on. It does NOT re-apply changes
    # to an already-imported realm; editing `keycloak/realm-gadonghr.json`
    # after the first boot needs a manual re-import or `kcadm.sh` edit
    # (see deploy/keycloak/README.md).
    command: ["start", "--http-enabled=true", "--hostname=https://${PUBLIC_HOST}/auth", "--http-relative-path=/auth", "--proxy-headers=xforwarded", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      # Task 15b: the `gadonghr` realm import — `web` (public PWA client)
      # and `seeder` (confidential service-account client) — read-only, so
      # the container can never write back into the source-controlled
      # file. See deploy/keycloak/README.md for what is and is not
      # parameterised in this file, and deploy/scripts/seed.sh for how the
      # seeder client's secret is provisioned without ever being committed
      # here.
      - ./keycloak/realm-gadonghr.json:/opt/keycloak/data/import/realm-gadonghr.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `kc` router/service. No `labels:`
    # here anymore; Traefik's Docker provider (which used to read them)
    # is gone, so leaving these would be a second, dead source of truth.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Key management ====================
  vault:
    image: hashicorp/vault:1.17
    <<: *node-defaults
    mem_limit: 224m
    # Task 16: `disable_mlock = true` (vault.hcl — read that file's comment
    # for the full trade-off) means Vault never calls mlock, so it no
    # longer needs CAP_IPC_LOCK. `cap_add: [IPC_LOCK]` is deliberately
    # ABSENT here now — granting an unused capability to the service that
    # holds every unseal key is the opposite of least-privilege, and
    # `no-new-privileges` (inherited from `node-defaults` like every other
    # service, no exception) would make the capability inert anyway (see
    # vault.hcl).
    environment:
      # The stock entrypoint still attempts `setcap cap_ipc_lock=+ep` on
      # the `vault` binary unconditionally unless told not to; with no
      # `cap_add` and `no-new-privileges` on, that attempt is now
      # pure no-op noise (the grant can never take effect at the later
      # `su-exec` into the non-root `vault` user) — skip it outright rather
      # than let it run and silently do nothing.
      SKIP_SETCAP: "true"
    # Task 16: the root cause of the ORIGINAL crash-loop, before mlock ever
    # entered the picture — `/vault/data` is a named volume, not a path the
    # image pre-creates (unlike `/vault/config`/`/vault/logs`/`/vault/file`,
    # which the image ships pre-owned by `vault:vault` and which the stock
    # entrypoint already re-chowns if bind-mounted). Docker creates a fresh
    # named volume's mountpoint root-owned, and the stock entrypoint never
    # touches `/vault/data` at all — so every clean host reproduces the
    # original `permission denied` opening `vault.db` unless something
    # chowns it first. This runs as root (no `user:` override — the image's
    # own entrypoint needs to start as root to do this and its own
    # config/logs/file chown before it drops privilege itself via
    # `su-exec`; forcing a non-root `user:` here was tried on the droplet
    # and broke that root phase entirely, see vault.hcl), mirrors the stock
    # entrypoint's own "only chown if not already owned" check so it's a
    # cheap no-op on every boot after the first, and then hands off to the
    # real entrypoint with the exact args this service always ran with —
    # no manual chown step for a human to remember on the next fresh host.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$(stat -c %u /vault/data)" != "$$(id -u vault)" ]; then
          chown -R vault:vault /vault/data
        fi
        exec docker-entrypoint.sh vault server -config=/vault/config/vault.hcl
    volumes:
      - vault_data:/vault/data
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
    healthcheck:
      # `vault status` exits 0 unsealed, 2 sealed — CMD-SHELL's `|| true`
      # makes a SEALED vault (expected after every reboot, vault.hcl's own
      # header comment) still `healthy` at the Docker level, matching
      # every service's own `degraded`-not-crashed contract above; a
      # human unseal ceremony, not a container restart, is what fixes
      # `sealed`.
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || true"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ==================== Data plane ====================
  postgres:
    image: postgres:16
    <<: *node-defaults
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      # Read by postgres/init/01-roles.sql via `\getenv` — one LOGIN role
      # per schema, password never appears in the SQL file itself.
      DB_PASSWORD_ONBOARDING: ${DB_PASSWORD_ONBOARDING}
      DB_PASSWORD_SCHEDULER: ${DB_PASSWORD_SCHEDULER}
      DB_PASSWORD_TIMESHEET: ${DB_PASSWORD_TIMESHEET}
      DB_PASSWORD_ATTENDANCE: ${DB_PASSWORD_ATTENDANCE}
      DB_PASSWORD_LEAVE: ${DB_PASSWORD_LEAVE}
      DB_PASSWORD_CLAIMS: ${DB_PASSWORD_CLAIMS}
      DB_PASSWORD_PAYROLL: ${DB_PASSWORD_PAYROLL}
      DB_PASSWORD_AUTHZ: ${DB_PASSWORD_AUTHZ}
      DB_PASSWORD_CONFIG: ${DB_PASSWORD_CONFIG}
      DB_PASSWORD_AUDIT: ${DB_PASSWORD_AUDIT}
      DB_PASSWORD_NOTIFY: ${DB_PASSWORD_NOTIFY}
      DB_PASSWORD_DOCS: ${DB_PASSWORD_DOCS}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs 01-roles.sql exactly once, the first time this volume is
      # empty (docker-entrypoint-initdb.d convention) — creates every
      # schema-per-service role. Never re-run on an existing volume, so a
      # password rotation here needs its own `ALTER ROLE` run by hand
      # (deploy/README.md).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    <<: *node-defaults
    mem_limit: 160m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    <<: *node-defaults
    mem_limit: 80m
    # Task 16b: the healthcheck below reads `$$REDIS_PASSWORD` — `$$` is
    # Compose's own escape for a literal `$`, so this is a RUNTIME
    # reference to an environment variable inside the container (resolved
    # by the container's own shell when the healthcheck actually runs),
    # deliberately NOT a Compose-time `${REDIS_PASSWORD}` substitution
    # like `command:` below uses. Without this `environment:` block that
    # variable was never set inside the container at all — `printenv
    # REDIS_PASSWORD` was empty — so the healthcheck authenticated with an
    # empty password against a server actually guarded by `--requirepass`
    # and failed forever (`WRONGPASS`) even though Redis itself was
    # healthy. Fixed by passing the same value into the container's own
    # environment, not by rewriting the healthcheck to inline the literal
    # password via Compose-time substitution instead: the password is
    # already visible in `docker inspect`'s `Config.Cmd` either way (via
    # `--requirepass` below), so relocating it into `Config.Env` adds
    # exactly the same one extra plaintext-bearing field that inlining it
    # into `Healthcheck.Test` would have — no net reduction in `docker
    # inspect` exposure is actually achievable here, so this keeps the
    # more standard, idiomatic pattern instead.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # `--maxmemory` below the container's own `mem_limit` cgroup ceiling
    # is defense-in-depth: Redis evicts under its own policy well before
    # the kernel OOM-killer would ever have to act on this container.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    <<: *node-defaults
    mem_limit: 192m
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==================== Platform services (Task 6-12) ====================
  # `build:` here is for local/dev/CI use (`docker compose build`, run in
  # CI only — roadmap "Standing constraints": never on the server).
  # docker-compose.prod.yml replaces every `build:` with a pinned GHCR
  # `image:` and never builds.

  svc-crypto:
    build: { context: .., dockerfile: services/svc-crypto/Dockerfile }
    <<: *node-defaults
    mem_limit: 96m
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ID: ${VAULT_APPROLE_ID}
      VAULT_APPROLE_SECRET_FILE: /run/secrets/vault_approle_secret
    # Task 16b: `secrets:` (short or long mapping form) bind-mounts the
    # HOST `file:` source into the container with the HOST file's own
    # ownership/mode preserved verbatim — this container's process runs as
    # `node` (uid 1000, `services/svc-crypto/Dockerfile`'s own `USER
    # node`), so a root-only-readable host file (`-rw------- root:root`,
    # the correct host-side permission — least privilege for the one
    # thing with real filesystem access, e.g. a backup job) is EACCES to
    # it. The Compose *spec* documents `uid`/`gid`/`mode` fields on a
    # service's own `secrets:` entry that would remount the secret inside
    # the container under different ownership without touching the host
    # file — tried first here, then verified empirically rather than
    # assumed: `docker compose up`/`run` on this stack's actual engine
    # (Docker Compose v5.3.0, non-Swarm `docker compose`, which is what
    # this file and `auto-deploy-gadonghr.sh` both use — there is no
    # `docker stack deploy`/`deploy:` section anywhere in this repo) prints
    # `secrets \`uid\`, \`gid\` and \`mode\` are not supported, they will
    # be ignored` and mounts the file with the host owner untouched
    # regardless — those fields are Swarm-only. So the fix is the brief's
    # other option: keep the host file `-rw------- root:root` (never
    # `chmod 644`) and have the deploy script itself enforce the ownership
    # the `node` (uid 1000) container process needs, every run, so a fresh
    # host is never one remembered manual `chown` away from this exact
    # crash — see `scripts/auto-deploy-gadonghr.sh`'s "Ensure secret file
    # ownership" step and `README.md`'s install order.
    secrets: [vault_approle_secret]
    depends_on:
      vault: { condition: service_healthy }
    healthcheck: *http-health

  svc-config:
    build: { context: .., dockerfile: services/svc-config/Dockerfile }
    <<: *node-defaults
    mem_limit: 192m
    environment:
      <<: *oidc-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://config:${DB_PASSWORD_CONFIG}@postgres:5432/${POSTGRES_DB}
      AUTHZ_URL: http://svc-authz:3000
      CONFIG_PACK_SIGNING_KEY: ${CONFIG_PACK_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      svc-authz: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-config` router/service/middleware
    # (unchanged behavior: PathPrefix `/api/config` at priority 100,
    # `-strip` middleware removes that prefix before forwarding to this
    # service's own unprefixed `rules.controller.ts` routes). No `labels:`
    # here anymore — Traefik's Docker provider that used to read them is
    # gone, so leaving them would be a second, dead source of truth.

  svc-authz:
    build: { context: .., dockerfile: services/svc-authz/Dockerfile }
    <<: *node-defaults
    mem_limit: 192m
    environment:
      <<: *oidc-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://authz:${DB_PASSWORD_AUTHZ}@postgres:5432/${POSTGRES_DB}
      # Self-referential — `PermissionGuard` on this service's own admin
      # routes calls this same service's own `/decide` over HTTP
      # (app.module.ts's own comment: "a self-referential network hop,
      # not recursion").
      AUTHZ_URL: http://svc-authz:3000
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-authz` router/service/middleware
    # (same shape as `svc-config` above). No `labels:` here anymore.

  svc-audit:
    build: { context: .., dockerfile: services/svc-audit/Dockerfile }
    <<: *node-defaults
    mem_limit: 96m
    environment:
      <<: *oidc-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://audit:${DB_PASSWORD_AUDIT}@postgres:5432/${POSTGRES_DB}
      AUTHZ_URL: http://svc-authz:3000
    depends_on:
      postgres: { condition: service_healthy }
      svc-authz: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-audit` router/service/middleware
    # (same shape as `svc-config` above). No `labels:` here anymore.

  svc-i18n:
    build: { context: .., dockerfile: services/svc-i18n/Dockerfile }
    <<: *node-defaults
    mem_limit: 96m
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No Postgres, no AuthzClient (app.module.ts: "deliberately no
    # PermissionGuard ... every route this service exposes is public by
    # design") — bundles are read off disk at boot, so this service has
    # no dependency to wait on.
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-i18n` router/service/middleware
    # (same shape as `svc-config` above). `web`'s login screen fetches
    # `/api/i18n/bundles/:locale` before any principal exists
    # (bundles.controller.ts's own header), which is exactly why this
    # router must resolve with no auth in front of it. No `labels:` here
    # anymore.

  svc-notify:
    build: { context: .., dockerfile: services/svc-notify/Dockerfile }
    <<: *node-defaults
    mem_limit: 160m
    environment:
      <<: *oidc-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://notify:${DB_PASSWORD_NOTIFY}@postgres:5432/${POSTGRES_DB}
      AUTHZ_URL: http://svc-authz:3000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      NOTIFY_TENANT_DEFAULT_LANG: ${DEFAULT_LOCALE:-th}
    depends_on:
      postgres: { condition: service_healthy }
      svc-authz: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-notify` router/service/middleware
    # (same shape as `svc-config` above). No `labels:` here anymore.

  svc-docs:
    build: { context: .., dockerfile: services/svc-docs/Dockerfile }
    <<: *node-defaults
    # The heaviest of the seven: headless Chromium (`ChromiumPdfRenderer`)
    # is spawned per PDF render, on top of Node/Nest's own baseline — see
    # deploy/README.md's memory budget table for the arithmetic.
    mem_limit: 512m
    environment:
      <<: *oidc-env
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://docs:${DB_PASSWORD_DOCS}@postgres:5432/${POSTGRES_DB}
      AUTHZ_URL: http://svc-authz:3000
      CRYPTO_URL: http://svc-crypto:3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DOCS_BUCKET: ${DOCS_BUCKET:-gadonghr-docs}
    depends_on:
      postgres: { condition: service_healthy }
      svc-authz: { condition: service_healthy }
      svc-crypto: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *http-health
    # Task 16f: routing moved to Traefik's file provider — see
    # `traefik/dynamic/routes.yml`'s `svc-docs` router/service/middleware
    # (same shape as `svc-config` above). No `labels:` here anymore.

  # ==================== PWA (Task 15c) ====================
  # Static bundle served by unprivileged nginx on :8080 (web/Dockerfile,
  # web/nginx.conf) — no `/health` endpoint (nothing to poll but the
  # index page), no runtime env (VITE_* is baked in at `vite build` time,
  # see web/src/env.ts). Task 16f: routing moved to Traefik's file
  # provider — see `traefik/dynamic/routes.yml`'s `web` router/service.
  # `Host(\`{{ env "PUBLIC_HOST" }}\`)` with NO PathPrefix is the catch-all
  # at the domain root, so it MUST sit at a lower Traefik priority than
  # every `/api/*` router — priority 1 there vs 100 on every svc-* router
  # — or the PWA's own router would swallow `/api/config`, `/api/authz`,
  # etc. before they ever reach Traefik's `/api/*` routers
  # (`compose-validation.test.ts` asserts this ordering explicitly,
  # because that failure mode looks like "the UI loads but nothing on it
  # works", not a visible outage). `web/nginx.conf`'s own `try_files $uri
  # $uri/ /index.html` is what makes a direct/refreshed deep link like
  # `/admin/statutory-rules` return the SPA shell instead of a 404 — this
  # router only decides that Traefik hands the request to nginx at all;
  # nginx's own `try_files` is what actually resolves the deep path once
  # it gets there.
  web:
    build: { context: .., dockerfile: web/Dockerfile }
    <<: *node-defaults
    # nginx serving a static bundle — no Node runtime, no DB pool, no
    # in-memory cache. 64m is generous headroom over nginx's actual
    # working set for this.
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No `labels:` here anymore — Traefik's Docker provider that used to
    # read them is gone (see `traefik` service above); leaving them would
    # be a second, dead source of truth for this router.

networks:
  internal:
    name: gadong-internal

secrets:
  vault_approle_secret:
    file: ./secrets/vault_approle_secret   # gitignored — created by vault-init.sh

volumes:
  pg_data:
  vault_data:
  rabbitmq_data:
  minio_data:
  letsencrypt:
