# GaDongHR — production overlay (Task 13)
#
# Applied on top of docker-compose.yml on gadonghr-prod ONLY:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Replaces every one of the seven services' `build:` with a pinned GHCR
# `image:` and `pull_policy: always`. `build: !reset null` is not a no-op
# comment — without it, Compose's merge would keep the base file's
# `build:` key alongside this file's `image:`, and `docker compose up`
# builds automatically for any service with a `build:` key whose image
# isn't already present locally. On a server that has the git checkout
# (needed for `docker-entrypoint-initdb.d`/`vault.hcl`/scripts) but must
# NEVER build (roadmap "Standing constraints": "Build only in CI, pull
# from ghcr.io/mavrone81/gadonghr-<service>. Never `docker compose build`
# on the server."), that silent auto-build path is exactly the failure
# this overlay exists to close. Verified empirically: `docker compose
# -f docker-compose.yml -f docker-compose.prod.yml config` (this file's
# own test, deploy/compose-validation.test.ts) shows no service with both
# `build` and `image` set.
#
# `GADONG_VERSION` is the exact commit sha CI built and pushed
# (auto-deploy-gadonghr.sh sets it from `refs/ci-pass/<sha>` before
# calling this). It is the ONE deploy-time image tag variable in this
# file — used by all eight services, `web` included — because CI
# (`.github/workflows/ci.yml`'s `build-images` matrix) publishes an
# immutable `:<sha>` tag for every one of the sixteen images, this one's
# own leg among them. `GADONG_BUILD_SHA` is a DIFFERENT, build-time-only
# variable — CI passes it to `docker build --build-arg` so `/health` can
# report which commit an image was built from (packages/kernel/src/version.ts)
# — it is never set at deploy time and must never appear in an `image:` tag
# here; using it as a fallback-driven pull tag was Task 15's bug (fixed by
# this task), because the two vars silently diverged one service (`web`) at
# a time to `GADONG_VERSION` and left the other seven on a build-time-only
# variable that resolved to nothing, so they all fell through to `:latest`
# — a tag CI never publishes (see `build-images`'s `tags:` list) — and the
# pull 404'd. The `:-stable` fallback exists ONLY so this file parses in
# CI/local validation with no `.env` present — `auto-deploy-gadonghr.sh`
# always exports a real `GADONG_VERSION` sha before pulling, so production
# never actually falls through to it. Unlike the old unconditional `:main`
# tag, `:stable` is published ONLY for a push to whichever branch
# `.github/workflows/ci.yml`'s `env.GADONG_DEPLOY_BRANCH` names (the branch
# production tracks) — see that workflow's `build-images` job comment — so
# a feature/phase branch build can never clobber the tag this fallback
# resolves to. If `:stable` has never been published yet (a brand new
# repo, or the tracked branch has never had a green CI run), this fallback
# 404s on pull — a loud, fail-closed default, and still strictly safer
# than silently deploying `:latest`, which CI never publishes at all.

name: gadonghr

services:
  svc-crypto:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-crypto:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-config:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-config:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-authz:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-authz:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-audit:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-audit:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-i18n:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-i18n:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-notify:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-notify:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-docs:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-docs:${GADONG_VERSION:-stable}
    pull_policy: always

  svc-onboarding:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-svc-onboarding:${GADONG_VERSION:-stable}
    pull_policy: always

  # `web` uses the exact same `GADONG_VERSION` variable as the seven
  # platform services above — see the file-level comment. Defaults to the
  # floating `:main` tag, which CI's `build-images` matrix publishes on
  # every push alongside the sha tag — confirmed pullable (task situation:
  # "gadonghr-web:main returns HTTP 200").
  web:
    build: !reset null
    image: ghcr.io/mavrone81/gadonghr-web:${GADONG_VERSION:-stable}
    pull_policy: always
